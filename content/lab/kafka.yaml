apiVersion: v1
kind: Namespace
metadata:
  name: lab
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: lab
spec:
  clusterIP: None            # headless: stable per-pod DNS for advertised listeners
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
    - name: controller
      port: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: lab
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          ports:
            - name: kafka
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            # ---- KRaft, combined broker+controller, single node ----
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: CLUSTER_ID
              value: "4L6g3nShT-eMCtK--X86sw"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            # THE listener config. The quorum voter and the advertised host must be
            # the pod's own stable DNS name, resolvable from inside the pod itself.
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka.lab.svc.cluster.local:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-0.kafka.lab.svc.cluster.local:9092"
            # ---- single-replica overrides: without these, internal topics
            # ---- default to RF=3 and the broker refuses to create them ----
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR
              value: "1"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "1"
            # ---- demo ergonomics ----
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"          # default 3000: removes a flat 3s from first rebalance
            # Only needed if a client wants session.timeout.ms below the broker
            # floor. The consumer below uses 10000 and works WITHOUT this, so
            # treat it as optional headroom, not a requirement.
            - name: KAFKA_GROUP_MIN_SESSION_TIMEOUT_MS
              value: "1000"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"      # force explicit topic creation with 12 partitions
            - name: KAFKA_NUM_PARTITIONS
              value: "12"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms256m -Xmx512m"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 640Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: data
          emptyDir: {}          # lab only: wiped on pod restart, no PVC to clean up
